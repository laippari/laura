# Julkaisee sivun GitHub Pagesiin jokaisella main-haaran pushilla.
# Sivu on staattinen (ei käännösvaihetta): julkaistaan index.html, src/ ja assets/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Kokoaminen ja julkaisu ovat eri töitä: samassa työssä julkaisu ehti hakea pakettia ennen kuin se näkyi
# ajon pakettilistassa ("No artifacts named github-pages") ja ajo kaatui.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check module syntax
        run: |
          test -s index.html || { echo "index.html puuttuu"; exit 1; }
          for f in $(find src -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/
          if [ -d assets ]; then cp -r assets _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
