<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a3112b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Joulukalenteri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fredoka:wght@500;600&family=Jost:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080305;
      --cream: #f4eadb;
      --cream-2: rgba(244, 234, 219, 0.72);
      --gold: #dcb670;
      --glass: rgba(16, 21, 26, 0.66);
      --edge: rgba(255, 255, 255, 0.09);
      --serif: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --round: "Fredoka", "Nunito", "Varela Round", -apple-system, sans-serif;
      --sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    /* the knitted red behind everything, so the strips under the browser's bars and the camera match the wall */
    html { background: #a3112b repeat; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body { font: 400 16px/1.5 var(--sans); color: var(--cream); }
    canvas#c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    button { font: inherit; color: inherit; cursor: pointer; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 30px;
      border: 1px solid rgba(220, 182, 112, 0.75); border-radius: 999px; background: rgba(220, 182, 112, 0.13);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      font: 500 13px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--cream);
      transition: background 0.25s var(--ease), color 0.25s var(--ease), transform 0.25s var(--ease);
    }
    .btn:focus-visible { background: var(--gold); color: #1d130a; outline: none; }
    @media (hover: hover) { .btn:hover { background: var(--gold); color: #1d130a; } }
    .btn:active { transform: scale(0.97); }
    .btn.small { min-height: 40px; padding: 0 20px; font-size: 11.5px; }
    .eyebrow { margin: 0; font: 500 12px/1 var(--sans); letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); }

    /* a short loading moment: a beating heart, until the scene is ready and she has had time to look */
    #loading {
      position: fixed; inset: -200px 0; z-index: 20; display: grid; place-items: center; background: var(--bg);
      transition: opacity 0.9s ease, visibility 0s 0.9s; pointer-events: none;
    }
    body.ready #loading { opacity: 0; visibility: hidden; }
    #loading div { position: relative; width: 96px; height: 96px; display: grid; place-items: center; font-size: 40px; }
    #loading span { animation: beat 1s ease-in-out infinite; }
    #loading div::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(220, 182, 112, 0.2);
      border-top-color: var(--gold); animation: turn 1.1s linear infinite;
    }
    @keyframes beat { 0%, 100% { scale: 1; } 18% { scale: 1.22; } 36% { scale: 1; } 54% { scale: 1.14; } 72% { scale: 1; } }
    @keyframes turn { to { rotate: 360deg; } }

    /* welcome */
    #intro {
      position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 0 24px calc(2vh + var(--safe-b)); text-align: center; pointer-events: none;
      background: radial-gradient(ellipse min(92vw, 520px) min(30vh, 300px) at 50% 49%, rgba(8, 3, 5, 0.86) 0%, rgba(8, 3, 5, 0.6) 55%, rgba(8, 3, 5, 0) 100%);
      opacity: 0; transition: opacity 0.9s var(--ease), visibility 0s 0.9s;
    }
    body.titled #intro { opacity: 1; }
    body.titled #intro .btn { pointer-events: auto; }
    #intro.gone { opacity: 0 !important; visibility: hidden; }
    #intro.gone .btn { pointer-events: none !important; }
    #intro > * { opacity: 0; transform: translateY(14px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
    body.titled #intro > * { opacity: 1; transform: none; }
    body.titled #intro > :nth-child(1) { transition-delay: 0.15s; }
    body.titled #intro > :nth-child(2) { transition-delay: 0.3s; }
    body.titled #intro > :nth-child(3) { transition-delay: 0.45s; }
    body.titled #intro > :nth-child(4) { transition-delay: 0.65s; }
    #intro h1 { margin: 6px 0 0; font: 600 clamp(42px, 12vw, 88px)/1.1 var(--round); letter-spacing: 0.005em; white-space: nowrap; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6); }
    #intro p.lead { margin: 0 0 24px; color: var(--cream); font: 500 clamp(19px, 5.2vw, 28px)/1.25 var(--round); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); }

    /* calendar chrome: the title and the status line stay readable over the knitted wall */
    body::before, body::after {
      content: ""; position: fixed; left: 0; right: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.8s var(--ease);
    }
    body::before { top: 0; height: 110px; background: linear-gradient(to bottom, rgba(8, 3, 5, 0.5), rgba(8, 3, 5, 0)); }
    body::after { bottom: 0; height: 170px; background: linear-gradient(to top, rgba(8, 3, 5, 0.62), rgba(8, 3, 5, 0)); }
    body.cal::before, body.cal::after { opacity: 1; }
    #top {
      position: fixed; left: 0; right: 0; top: calc(16px + var(--safe-t)); z-index: 3; text-align: center; pointer-events: none;
      font: italic 500 21px/1.2 var(--serif); color: var(--cream); opacity: 0; transition: opacity 0.8s var(--ease);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7), 0 1px 12px rgba(0, 0, 0, 0.7);
    }
    #status {
      position: fixed; left: 0; right: 0; bottom: calc(22px + var(--safe-b)); z-index: 3; display: flex; flex-direction: column;
      align-items: center; gap: 12px; padding: 0 24px; text-align: center; opacity: 0; pointer-events: none;
      transition: opacity 0.6s var(--ease);
    }
    #status span { color: var(--cream); font-size: 14.5px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), 0 1px 12px rgba(0, 0, 0, 0.8); }
    #status span:empty, #status button[hidden] { display: none; }
    body.cal #top { opacity: 0.92; }
    body.cal.reveal #top, body.cal.near #top { opacity: 0; }
    body.cal #status.on { opacity: 1; }
    body.cal #status.on button { pointer-events: auto; }

    #hint {
      position: fixed; left: 0; top: 0; z-index: 4; opacity: 0; pointer-events: none; will-change: transform;
      transition: opacity 0.5s var(--ease);
    }
    #hint.on { opacity: 1; pointer-events: auto; }
    #hint button {
      position: relative; display: block; transform: translateX(-50%); padding: 9px 16px 8px; border: 0; border-radius: 999px;
      background: var(--cream); color: #2a1a10; font: 500 11.5px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase;
      white-space: nowrap; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), 0 0 24px rgba(255, 196, 119, 0.35);
      animation: bob 1.8s ease-in-out infinite;
    }
    #hint button::before {
      content: ""; position: absolute; left: 50%; top: -5px; width: 11px; height: 11px; background: var(--cream);
      transform: translateX(-50%) rotate(45deg); border-radius: 2px;
    }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 5px; } }

    #sound {
      position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(12px + var(--safe-t)); z-index: 8;
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.22); padding: 0;
      background: rgba(30, 6, 12, 0.42); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      display: grid; place-items: center; color: var(--cream); opacity: 0; transition: opacity 0.8s var(--ease);
    }
    body.ready #sound { opacity: 0.9; }
    #sound svg { width: 20px; height: 20px; }
    #sound .off { display: none; }
    #sound[aria-pressed="false"] .on { display: none; }
    #sound[aria-pressed="false"] .off { display: block; }
    #tease {
      position: fixed; left: 50%; top: 70%; z-index: 6; transform: translate(-50%, 0) scale(0.9); opacity: 0;
      padding: 12px 22px; border-radius: 999px; background: var(--cream); color: #5a1220; white-space: nowrap; pointer-events: none;
      font: 600 clamp(16px, 4.6vw, 20px)/1.2 var(--round); box-shadow: 0 8px 26px rgba(40, 0, 10, 0.4);
      transition: opacity 0.3s var(--ease), transform 0.45s cubic-bezier(0.2, 0.9, 0.25, 1.3);
    }
    #tease.on { opacity: 1; transform: translate(-50%, 0) scale(1); }

    /* what a door holds */
    #card {
      position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); z-index: 7; width: min(460px, calc(100vw - 28px));
      transform: translate(-50%, 26px); opacity: 0; visibility: hidden; padding: 24px 24px 20px; border-radius: 24px; text-align: center;
      background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      transition: opacity 0.55s var(--ease), transform 0.55s var(--ease), visibility 0s 0.55s;
    }
    #card.on { opacity: 1; transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }
    #card h2 { margin: 12px 0 8px; font: 500 clamp(28px, 7.4vw, 36px)/1.08 var(--serif); text-wrap: balance; }
    #card p.body { margin: 0 0 20px; color: var(--cream-2); white-space: pre-line; text-wrap: pretty; -webkit-user-select: text; user-select: text; }
    #card .btn { width: 100%; }

    #fail {
      position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 32px; text-align: center;
      background: var(--bg); color: var(--cream-2);
    }
    @media (prefers-reduced-motion: reduce) { #hint button { animation: none; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c" aria-label="3D-joulukalenteri"></canvas>

  <section id="intro">
    <p class="eyebrow" id="intro-eyebrow"></p>
    <h1 id="intro-title"></h1>
    <p class="lead" id="intro-text"></p>
    <button class="btn" id="enter" type="button"></button>
  </section>

  <div id="top"></div>
  <div id="hint"><button type="button"></button></div>
  <div id="status"><span></span><button class="btn small" type="button" hidden></button></div>
  <div id="tease" role="status"></div>
  <button id="sound" type="button" aria-pressed="true">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18"/></svg>
  </button>

  <section id="card" aria-live="polite">
    <p class="eyebrow" id="card-eyebrow"></p>
    <h2 id="card-title"></h2>
    <p class="body" id="card-text"></p>
    <button class="btn" id="close" type="button"></button>
  </section>

  <div id="loading"><div><span>❤️</span></div></div>
  <div id="fail" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
